name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check cache version policy
        run: npm run check:cache-version
        env:
          CACHE_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CACHE_CHECK_HEAD: ${{ github.sha }}

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: npm run test:syntax

      - name: Verify shipped asset references
        run: npm run test:assets

      - name: Run unit contracts
        run: npm run test:unit

      - name: Run Chromium browser tests
        run: npx playwright test --project=chromium --workers=1

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7